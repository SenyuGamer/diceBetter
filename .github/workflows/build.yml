name: Build and Package

on:
  push:
    branches: [ "main", "experimental" ]
  pull_request:
    branches: [ "main", "experimental" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build BetterDice (Owlbear Rodeo Plugin)
      run: yarn build

    - name: Upload BetterDice Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BetterDice-Build
        path: dist/
        retention-days: 7

    - name: Package BeyondOwl for Chrome (.zip)
      run: |
        cd BeyondOwl
        zip -r ../BeyondOwl-Chrome.zip *
        cd ..

    - name: Package BeyondOwl for Firefox (.xpi)
      run: |
        cd BeyondOwl
        zip -r ../BeyondOwl-Firefox.xpi *
        cd ..

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BeyondOwl-Packages
        path: |
          BeyondOwl-Chrome.zip
          BeyondOwl-Firefox.xpi
        retention-days: 7

    - name: Publish Release to GitHub (Experimental)
      if: github.ref == 'refs/heads/experimental'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: experimental-latest
        name: "BeyondOwl Experimental Build"
        body: |
          🚀 **Compilación automática de la rama `experimental`**
          
          ### Archivos para descargar:
          - **Chrome / Edge / Brave / Opera**: `BeyondOwl-Chrome.zip` (Descomprimir y cargar en `chrome://extensions` con Modo desarrollador).
          - **Firefox**: `BeyondOwl-Firefox.xpi` (Instalable en Firefox / Firefox Developer Edition o para subir a firmar en AMO).
          - **BetterDice**: Plugin compilado para Owlbear Rodeo.
        prerelease: true
        files: |
          BeyondOwl-Chrome.zip
          BeyondOwl-Firefox.xpi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
